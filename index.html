  zoneToggleOff: { background: "#3A3833" },
  zoneToggleDot: { width: 20, height: 20, borderRadius: "50%", background: "#F2EDE6", transition: "transform 0.15s" },
  zoneToggleDotOn: { transform: "translateX(20px)" }
};


if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
  document.getElementById("boot-error").style.display = "block";
  document.getElementById("boot-error").textContent = "No se pudo cargar React desde internet.";
} else {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
}
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.error("SW error:", err));
    });
  }
</script>
