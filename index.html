async function sb(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      ...options.method === "POST" || options.method === "PATCH" ? { Prefer: "return=representation" } : {},
      ...options.headers
    }
  });
  if (!res.ok) {
    const body = await res.text();
    const err = new Error(`Supabase ${options.method || "GET"} ${path} \u2192 ${res.status}: ${body}`);
    err.status = res.status;
    try {
      const j = JSON.parse(body);
      err.dbCode = j.code;
      err.dbMessage = j.message;
    } catch (e) {
    }
    throw err;
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function uploadDocumentPhoto(file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${Date.now()}-${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/documentos/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": file.type || "application/octet-stream"
    },
    body: file
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`Subida de archivo \u2192 ${res.status}: ${body}`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/documentos/${path}`;
}

function waLink(phone, text) {
  let digits = String(phone || "").replace(/[^\d+]/g, "");
  if (!digits) return null;
  if (digits.startsWith("+")) digits = digits.slice(1);
  else if (digits.startsWith("00")) digits = digits.slice(2);
  else if (/^[6-9]\d{8}$/.test(digits)) digits = "34" + digits;
  if (digits.length < 8) return null;
  return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
}
